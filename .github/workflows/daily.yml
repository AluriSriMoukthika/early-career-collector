name: early-career-daily
on:
  schedule:
    # Hourly UTC triggers (GitHub can delay or drop scheduled runs). scripts/schedule_guard.py
    # lets only the first trigger at/after 07:40 New York time run each day; the rest skip in ~15s.
    - cron: "50 11-23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run = daily collection | verify = test every source | discover = look for new company boards | test-notification = post a sample report issue"
        default: run
        type: choice
        options: [run, verify, discover, test-notification]
permissions:
  contents: write   # save history and reports
  issues: write     # post the daily report as an issue (GitHub emails it to you)
concurrency:
  group: early-career-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Schedule guard
        id: guard
        run: python scripts/schedule_guard.py

      - name: Unit tests
        if: steps.guard.outputs.run == 'true'
        run: python -m unittest discover -s tests -v

      - name: Collect
        id: collect
        if: steps.guard.outputs.run == 'true' && (github.event.inputs.mode || 'run') != 'test-notification'
        continue-on-error: true
        run: python ats_collector.py ${{ github.event.inputs.mode || 'run' }}

      - name: Update master CSV from verification results
        if: steps.guard.outputs.run == 'true' && github.event.inputs.mode == 'verify'
        run: python update_master.py

      - name: Mark today done (only if collection fully succeeded)
        if: steps.guard.outputs.run == 'true' && steps.collect.outcome == 'success' && (github.event.inputs.mode || 'run') == 'run'
        run: python scripts/schedule_guard.py mark-done

      - name: Save history and reports
        if: always() && steps.guard.outputs.run == 'true'
        run: bash scripts/save_history.sh

      - name: Post report as a GitHub issue (GitHub emails it to you)
        if: always() && steps.guard.outputs.run == 'true' && (github.event.inputs.mode || 'run') == 'run'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/post_issue.py report

      - name: Post a sample report issue (notification test)
        if: steps.guard.outputs.run == 'true' && github.event.inputs.mode == 'test-notification'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/post_issue.py sample

      - name: Upload reports
        if: always() && steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_id }}
          path: |
            reports/
            source_status.csv
          if-no-files-found: ignore

      - name: Fail the run if collection failed
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::Collector reported failed sources above threshold - see report"
          exit 1
